[package]
name = "rust_lib_networksharing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
btleplug = "0.13.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3.34"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Foundation_Collections", "Win32_System_WinRT"] }
